name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Unit and MCP server tests
        run: uv run --python 3.12 --with pillow --with ijson --with "mcp>=2.3" python -m unittest discover -s tests -v
