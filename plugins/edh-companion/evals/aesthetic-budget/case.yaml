schema_version: "1.0"
name: aesthetic-budget
description: Drippy upgrades change printings, not cards, respect a per-card max and an aesthetic budget, and label prices.
tags: [aesthetics, budget]
context: {scaffold_script: scaffold.sh}
execution: {prompt: "I want to drip out my Spider-Gwen deck: foils or borderless where possible, nothing over $15 a card, and no more than $80 extra overall. What would you change?", max_turns: 40, timeout_seconds: 1500}
runs: 1
graders:
  - {type: llm, name: printings-and-prices, criteria: "PASS if the suggestions are printing or finish changes of cards already in the deck (not new cards), each with a price that has a source and date or is labelled an estimate, none above $15 each, a total extra cost at or under $80, and the strict Spider-Man art rule is kept (it may flag Sol Ring and Lightning Greaves as off theme). If no price source was reachable, it also PASSES by saying so plainly, giving no invented prices, and offering how to continue. FAIL if it swaps in different cards without saying so, exceeds a limit, or gives prices with no source or estimate label."}
