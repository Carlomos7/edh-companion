schema_version: "1.0"
name: research-large-find
description: A card question against a large saved research.json is answered from a targeted search, not by reading the whole file.
tags: [research, cost, regression]
context: {scaffold_script: scaffold.sh}
execution: {prompt: "What did my saved research say about Lightning Bolt for the Spider-Gwen deck? Don't research anything new.", max_turns: 15, timeout_seconds: 600}
runs: 2
graders:
  - {type: tool_used, name: no-whole-read, tool: Read, input_match: "research\\.json\"(?![^}]*\"limit\")", min: 0, max: 0, arm: both}
  - {type: llm, name: found-it, criteria: "PASS if the reply says the saved research found Lightning Bolt is cut for Galvanic Discharge (Spider Lab, to hit 3-toughness blockers). FAIL if it says nothing was found, invents other claims, or starts new research."}
