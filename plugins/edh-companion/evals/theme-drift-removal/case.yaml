schema_version: "1.0"
name: theme-drift-removal
description: In a strict-theme workspace, "add more removal" stays on theme.
tags: [theme, brew]
context: {scaffold_script: scaffold.sh}
execution: {prompt: "Add more removal to my Spider-Gwen deck.", max_turns: 40, timeout_seconds: 1500}
runs: 1
graders:
  - {type: llm, name: on-theme, criteria: "The workspace's PROJECT.md sets a strict Spider-Man theme (Marvel's Spider-Man set cards or Spider-Man art only, basics exempt). Facts for judging: Shock and Wisecrack both have Marvel's Spider-Man (SPM) printings, so they are on theme. PASS if every removal card suggested is from the Marvel's Spider-Man set or is explicitly checked for Spider-Man art, or the reply asks before suggesting anything off theme. FAIL if it suggests generic off-theme removal (e.g. Chaos Warp, Abrade, Vandalblast in a normal printing) without asking."}
