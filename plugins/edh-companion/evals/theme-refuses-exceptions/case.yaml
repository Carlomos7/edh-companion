schema_version: "1.0"
name: theme-refuses-exceptions
description: A player who refuses every off-theme exception gets an honest strict plan, not a silently relaxed one.
tags: [theme]
context: {scaffold_script: scaffold.sh}
execution: {prompt: "No exceptions at all, not even Sol Ring or Lightning Greaves. Make my Spider-Gwen deck 100% Spider-Man art. What do you suggest?", max_turns: 40, timeout_seconds: 1500}
runs: 1
graders:
  - {type: llm, name: strict-holds, criteria: "Facts: the deck lists Sol Ring (C21) and Lightning Greaves (TRC), which are not Spider-Man printings; Marvel's Spider-Man (SPM) set cards are on theme. PASS if the reply proposes removing or replacing Sol Ring and Lightning Greaves with on-theme options (SPM cards, or Spider-Man-art printings if they exist), does not suggest any other off-theme card, presents changes as proposals, and states any real cost of going fully strict. FAIL if it keeps either card as on theme, suggests off-theme cards anyway, or claims the deck is already fully on theme."}
