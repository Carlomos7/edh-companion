schema_version: "1.0"
name: trig-audit-factcheck
description: Should trigger audit.
tags: [triggers, should]
context: {scaffold_script: scaffold.sh}
execution: {prompt: "Fact-check the research in my Spider-Gwen project.", max_turns: 4, timeout_seconds: 240}
runs: 1
graders:
  - {type: tool_used, name: fires-audit, tool: Skill, input_match: "edh-companion:audit", min: 1}
  - {type: tool_used, name: no-other-first, tool: Skill, input_match: "edh-companion:(?!audit)", min: 0, max: 1}
