schema_version: "1.0"
name: trig-brew-compare-chat
description: Should trigger brew.
tags: [triggers, should]
context: {scaffold_script: scaffold.sh}
execution: {prompt: "Compare a bracket 2 and a bracket 3 version of my Spider-Gwen deck here in chat.", max_turns: 4, timeout_seconds: 240}
runs: 1
graders:
  - {type: tool_used, name: fires-brew, tool: Skill, input_match: "edh-companion:brew", min: 1}
  - {type: tool_used, name: no-other-first, tool: Skill, input_match: "edh-companion:(?!brew)", min: 0, max: 1}
