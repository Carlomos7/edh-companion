schema_version: "1.0"
name: trig-present-page
description: Should trigger present.
tags: [triggers, should]
context: {scaffold_script: scaffold.sh}
execution: {prompt: "Make a comparison page of my Spider-Gwen builds I can share.", max_turns: 4, timeout_seconds: 240}
runs: 1
graders:
  - {type: tool_used, name: fires-present, tool: Skill, input_match: "edh-companion:present", min: 1}
  - {type: tool_used, name: no-other-first, tool: Skill, input_match: "edh-companion:(?!present)", min: 0, max: 1}
