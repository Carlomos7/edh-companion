schema_version: "1.0"
name: trig-research-compare
description: Should trigger research.
tags: [triggers, should]
context: {scaffold_script: scaffold.sh}
execution: {prompt: "Compare Kenrith and Najeela as five-color commanders for me.", max_turns: 4, timeout_seconds: 240}
runs: 1
graders:
  - {type: tool_used, name: fires-research, tool: Skill, input_match: "edh-companion:research", min: 1}
  - {type: tool_used, name: no-other-first, tool: Skill, input_match: "edh-companion:(?!research)", min: 0, max: 1}
