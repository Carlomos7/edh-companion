<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Design system, mobile first. Anton display + IBM Plex body. Every size comes from the tokens below:
   space 4-8-12-16-24-32-48, type xs/sm/base/lg + fluid headings, radius sm/md/pill, card corners 4.75%/3.4% (63x88 mm, 3 mm corners).
   Controls are 40px tall, 44px on touch screens (WCAG 2.5.8 floor is 24px; Apple/Material ask 44-48). Colors are tokens with a dark mode. */
:root{color-scheme:light;
 --bg:#eef1f6;--surface:#ffffff;--surface-2:#e3e8f1;--field:#f7f9fc;--line:#d5dbe6;--grid:#e6eaf1;
 --text:#131a2a;--text-2:#3f4a5e;--muted:#566074;--accent:var(--th-l-a,#56657a);--accent-2:var(--th-l-a2,var(--accent));--gold:#8a5f08;--gc:#5b49d0;--gc-ink:#fff;--link:#1b5bb5;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
 --good:#2c7a4b;--warn:#8a5f08;--bad:#c0392b;
 --t-S:#184f95;--t-A:#256abf;--t-B:#3987e5;--t-C:#6da7ec;--t-D:#86b6ef;
 --display:"Anton","Impact","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
 --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;
 --fs-xs:12px;--fs-sm:14px;--fs-base:clamp(15px,.9rem + .15vw,16px);--fs-lg:17px;
 --fs-h1:clamp(34px,5.6vw + 12px,60px);--fs-h2:clamp(24px,2vw + 16px,32px);
 --r-sm:4px;--r-md:8px;--r-pill:999px;--card-r:4.75%/3.4%;
 --ctl:40px;--gutter:clamp(16px,3vw,32px);--nav-h:52px;--maxw:1200px;
 --shadow-card:0 1px 2px rgba(10,15,25,.18),0 6px 16px rgba(10,15,25,.14)}
@media (pointer:coarse){:root{--ctl:44px}}
/* report look: --th-* are set per commander (color identity or a saved theme) by applyLook(); each is pre-checked for 4.5:1 */
:root{--accent-soft:color-mix(in srgb,var(--accent) 12%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
 --bg:#0d111a;--surface:#161c29;--surface-2:#222a3b;--field:#10151f;--line:#2a3245;--grid:#222a3a;
 --text:#e7ebf3;--text-2:#c3cad8;--muted:#9aa4b8;--accent:var(--th-d-a,#aab4c3);--accent-2:var(--th-d-a2,var(--accent));--gold:#e3b04b;--gc:#9a8ff0;--gc-ink:#0d111a;--link:#8bbcf5;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
 --good:#5fcf8c;--warn:#e3b04b;--bad:#f0605a;--t-S:#9ec5f4;--t-A:#6da7ec;--t-B:#3987e5;--t-C:#256abf;--t-D:#184f95;
 --shadow-card:0 1px 2px rgba(0,0,0,.5),0 8px 20px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{color-scheme:dark;
 --bg:#0d111a;--surface:#161c29;--surface-2:#222a3b;--field:#10151f;--line:#2a3245;--grid:#222a3a;
 --text:#e7ebf3;--text-2:#c3cad8;--muted:#9aa4b8;--accent:var(--th-d-a,#aab4c3);--accent-2:var(--th-d-a2,var(--accent));--gold:#e3b04b;--gc:#9a8ff0;--gc-ink:#0d111a;--link:#8bbcf5;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
 --good:#5fcf8c;--warn:#e3b04b;--bad:#f0605a;--t-S:#9ec5f4;--t-A:#6da7ec;--t-B:#3987e5;--t-C:#256abf;--t-D:#184f95;
 --shadow-card:0 1px 2px rgba(0,0,0,.5),0 8px 20px rgba(0,0,0,.45)}

/* base */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(var(--nav-h) + var(--sp-3));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-base)/1.5 var(--body);overflow-wrap:break-word}
a{color:var(--link);text-underline-offset:2px}
.num,code,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.t2{color:var(--text-2)}.note{font-size:var(--fs-xs);color:var(--muted);line-height:1.45}
:focus-visible{outline:3px solid var(--s1);outline-offset:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:max(var(--gutter),env(safe-area-inset-left,0px)) max(var(--gutter),env(safe-area-inset-right,0px))}
h2{font:400 var(--fs-h2)/1.05 var(--display);text-transform:uppercase;letter-spacing:.5px;margin:0 0 var(--sp-2);text-wrap:balance}
h3{font:600 var(--fs-xs)/1.3 var(--body);text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);margin:var(--sp-4) 0 var(--sp-2)}
h4{font:600 var(--fs-xs)/1.3 var(--body);text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);margin:0 0 var(--sp-1)}
.row{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.two,.three,.charts{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-4)}

/* masthead */
header.mast{position:relative;padding:var(--sp-5) 0 var(--sp-4);border-bottom:4px solid var(--text);overflow:hidden;
 background:linear-gradient(115deg,color-mix(in srgb,var(--accent) 9%,var(--bg)) 0%,var(--bg) 48%,color-mix(in srgb,var(--accent-2) 9%,var(--bg)) 100%)}
header.mast::before{content:"";position:absolute;inset:0;pointer-events:none}
/* optional saved-theme textures: decorative, behind the text, kept faint */
body[data-look="comic"] header.mast::before{background:radial-gradient(color-mix(in srgb,var(--accent) 30%,transparent) 1.3px,transparent 1.8px) 0 0/9px 9px;
 -webkit-mask-image:linear-gradient(90deg,transparent 30%,#000);mask-image:linear-gradient(90deg,transparent 30%,#000)}
body[data-look="gothic"] header.mast::before{background:linear-gradient(160deg,rgba(24,72,48,.16),rgba(72,76,86,.12)),repeating-linear-gradient(90deg,rgba(90,96,108,.08) 0 2px,transparent 2px 24px)}
body[data-look="flames"] header.mast::before{background:linear-gradient(0deg,rgba(40,110,255,.20),rgba(110,190,255,.08) 40%,transparent 70%);background-size:100% 180%;animation:flick 7s ease-in-out infinite alternate}
@keyframes flick{from{background-position:0 0}to{background-position:0 35%}}
header.mast .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr);column-gap:var(--sp-5);align-items:center}
header.mast h1{grid-column:1;grid-row:1;align-self:end;position:relative;z-index:1;margin:0;padding-right:52px;font:400 var(--fs-h1)/.95 var(--display);letter-spacing:.5px;text-transform:uppercase;text-wrap:balance}
header.mast h1 span{color:var(--accent)}
header.mast .sub{grid-column:1;grid-row:2;align-self:start;position:relative;z-index:1;margin:var(--sp-2) 0 0;color:var(--muted);max-width:62ch;font-size:var(--fs-sm)}
.fanbox{display:none}
#mastfx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.fan{display:flex;align-items:flex-end;justify-content:center;height:180px}
.fan .art{width:96px;margin-left:-34px;transform:rotate(var(--r)) translateY(var(--y));transition:transform .3s;box-shadow:var(--shadow-card)}
.fan .art:first-child{margin-left:0}.fanbox:hover .fan .art{transform:rotate(calc(var(--r)*1.4)) translateY(calc(var(--y) - 8px))}
.fanbox.on3d .fan{display:none}
.themebtn{position:absolute;top:0;right:max(var(--gutter),env(safe-area-inset-right,0px));z-index:2;font:500 16px var(--body);background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-pill);width:var(--ctl);height:var(--ctl);cursor:pointer}
@media (min-width:701px){header.mast{padding:var(--sp-6) 0 var(--sp-4)}header.mast .wrap{grid-template-columns:minmax(0,1fr) minmax(0,42%)}header.mast h1{padding-right:0}
 .fanbox{display:flex;grid-column:2;grid-row:1/span 2;height:220px;position:relative;align-items:center;justify-content:center}}

/* tabs */
nav.tabs{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .in{max-width:var(--maxw);margin:0 auto;padding:var(--sp-1) var(--gutter);display:flex;gap:var(--sp-1);overflow-x:auto;scrollbar-width:none;min-height:var(--nav-h);align-items:center}
nav button{font:400 15px var(--display);letter-spacing:.8px;text-transform:uppercase;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);padding:0 var(--sp-3);min-height:var(--ctl);cursor:pointer;white-space:nowrap;flex:none}
nav button:hover{color:var(--text)}nav button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs{box-shadow:inset 0 -2px 0 var(--accent-soft)}

/* layout */
main{max-width:var(--maxw);margin:0 auto;padding:var(--sp-4) var(--gutter) var(--sp-7);display:grid;gap:var(--sp-4)}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-4);min-width:0}
section.panel>h2:first-child{margin-top:0}
@media (min-width:641px){main{padding-top:var(--sp-5);gap:var(--sp-5)}section.panel{padding:var(--sp-5)}}
@media (min-width:821px){.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.charts{grid-template-columns:repeat(2,minmax(0,1fr))}}
footer.foot{max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter) calc(var(--sp-6) + env(safe-area-inset-bottom,0px));font-size:var(--fs-xs);color:var(--muted)}

/* controls */
.ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2);margin:0 0 var(--sp-3)}
.ctrl input[type=search],.ctrl .note,.ctrl .viewtog{grid-column:1/-1}.ctrl .note{margin:0;align-self:center}
@media (min-width:641px){.ctrl{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-3);align-items:center}.ctrl input[type=search]{flex:1 1 220px;max-width:320px}.ctrl .note{margin-left:auto}}
select,input[type=search],input[type=number]{font:400 var(--fs-sm) var(--body);color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 var(--sp-3);min-height:var(--ctl);min-width:0;width:100%}
@media (min-width:641px){select{width:auto}}
.btn{font:500 var(--fs-sm) var(--body);cursor:pointer;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 var(--sp-4);min-height:var(--ctl)}
.btn:hover{border-color:var(--s1)}
.btn.primary,.copy{background:var(--text);color:var(--bg);border-color:var(--text)}
.viewtog{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--field)}
.viewtog button{flex:1;font:500 var(--fs-sm) var(--body);border:0;background:none;color:var(--text-2);min-height:calc(var(--ctl) - 2px);padding:0 var(--sp-4);cursor:pointer}
.viewtog button[aria-pressed="true"]{background:var(--text);color:var(--bg)}

/* pills, tags, marks */
.pill{display:inline-flex;align-items:center;gap:var(--sp-1);font:500 var(--fs-xs)/1.5 var(--mono);text-transform:uppercase;letter-spacing:.5px;padding:0 var(--sp-2);border-radius:var(--r-pill);background:var(--surface-2);color:var(--text);white-space:nowrap;border:0}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--c)}
.pill.gc{background:var(--gc);color:var(--gc-ink)}
.pill.vok,.pill.vwarn,.pill.vno{text-transform:none}.pill.vok{box-shadow:inset 0 0 0 2px var(--good)}.pill.vwarn{box-shadow:inset 0 0 0 2px var(--warn)}.pill.vno{box-shadow:inset 0 0 0 2px var(--bad)}
.pill.lp{text-transform:none}.pill.lp-upcoming{box-shadow:inset 0 0 0 2px var(--warn)}.pill.lp-banned,.pill.lp-not_legal{box-shadow:inset 0 0 0 2px var(--bad)}
.st-pass{color:var(--good)}.st-warning,.st-unverified{color:var(--warn)}.st-fail{color:var(--bad)}
.tp{display:inline-block;font:600 10.5px/1 var(--mono);letter-spacing:.4px;text-transform:uppercase;padding:3px 5px;border-radius:3px;margin-left:var(--sp-1);vertical-align:1px;white-space:nowrap;background:var(--c);color:var(--ink,#fff)}
.tp.off{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:2px 4px}
.swp{display:inline-block;margin-left:var(--sp-1);font:600 var(--fs-xs)/1 var(--mono);color:var(--link)}
.flag{font-size:var(--fs-xs);padding:1px 6px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.pip{display:inline-block;width:15px;height:15px;border-radius:50%;font:600 9px/15px var(--mono);text-align:center;margin-left:1px;color:#111;background:#cbc2bf;vertical-align:-2px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.pip.W{background:#f8f6d8}.pip.U{background:#c1d7e9}.pip.B{background:#bab1ab}.pip.R{background:#e49977}.pip.G{background:#a3c095}
.pips{white-space:nowrap}
.rar{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px;vertical-align:0;box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.5px var(--line)}
.rar.common{background:#1a1718}.rar.uncommon{background:linear-gradient(135deg,#d7dde4,#707883)}.rar.rare{background:linear-gradient(135deg,#f0d78c,#a58e4a)}
.rar.mythic{background:linear-gradient(135deg,#f6a35e,#bf4427)}.rar.special,.rar.bonus{background:linear-gradient(135deg,#b07ccc,#652978)}
.legend{display:flex;gap:var(--sp-2) var(--sp-4);flex-wrap:wrap;align-items:center;font-size:var(--fs-xs);color:var(--muted);margin:var(--sp-3) 0 0}

/* card image: one component everywhere. Fixed 488/680 box = no layout shift; the skeleton color shows until the atlas paints */
.art{aspect-ratio:488/680;border-radius:var(--card-r);background-color:var(--surface-2);background-repeat:no-repeat;display:block;width:100%}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr));gap:var(--sp-3)}
@media (min-width:641px){.cardgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--sp-4)}}
@media (min-width:1025px){.cardgrid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}}
.tile{all:unset;box-sizing:border-box;cursor:zoom-in;display:grid;gap:var(--sp-1);align-content:start;min-width:0;position:relative;border-radius:var(--r-md)}
.tile .art{box-shadow:var(--shadow-card);transition:transform .15s ease-out,box-shadow .15s ease-out}
.tile:hover .art{transform:translateY(-3px)}
.tile:focus-visible{outline:3px solid var(--s1);outline-offset:3px}
.tile .nm{font-weight:600;font-size:var(--fs-sm);line-height:1.3;margin-top:var(--sp-1)}
.tile .meta{font-size:var(--fs-xs);color:var(--text-2);display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-2);align-items:center}
.tile .qty{position:absolute;top:6px;left:6px;font:600 var(--fs-xs)/1 var(--mono);background:rgba(10,14,22,.85);color:#fff;padding:4px 6px;border-radius:var(--r-sm)}
.tile .badges{position:absolute;top:6px;right:6px;display:flex;gap:3px}
.tile .badges>*{font:600 10.5px/1 var(--mono);padding:4px 5px;border-radius:var(--r-sm);background:rgba(10,14,22,.85);color:#fff;margin:0}
.tile .badges .gcb{background:var(--gc);color:var(--gc-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr));gap:var(--sp-3)}
@media (min-width:641px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--sp-4)}}

/* tiers */
.tier{display:grid;grid-template-columns:40px minmax(0,1fr);gap:var(--sp-3);padding:var(--sp-4) 0;border-top:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 320px}
.tier .lt{border-radius:var(--r-sm);display:grid;place-items:center;font:400 24px var(--display);color:#fff;height:40px;position:sticky;top:calc(var(--nav-h) + var(--sp-2))}.tier .lt.dk{color:#0d1a2e}
@media (min-width:641px){.tier{grid-template-columns:48px minmax(0,1fr);gap:var(--sp-4)}.tier .lt{height:48px;font-size:28px}}

/* rankings and research */
.tile .rk{position:absolute;top:6px;left:6px;font:600 var(--fs-xs)/1 var(--mono);background:rgba(10,14,22,.85);color:#fff;padding:4px 6px;border-radius:var(--r-sm)}
.rc{display:grid;grid-template-columns:72px minmax(0,1fr);gap:var(--sp-3);padding:var(--sp-3) 0;border-top:1px solid var(--line);font-size:var(--fs-sm)}
.rc>button{all:unset;cursor:zoom-in;align-self:start;border-radius:var(--card-r)}.rc>button:focus-visible{outline:3px solid var(--s1);outline-offset:2px}
.rc .nm{font-weight:600;font-size:var(--fs-base)}.rc ul{margin:0;padding-left:18px}.rc p{margin:var(--sp-1) 0}
@media (min-width:821px){.rc{grid-template-columns:96px minmax(0,1fr)}.rc .two{gap:var(--sp-3)}}
.why{font-size:var(--fs-xs);color:var(--text-2);line-height:1.4}

/* deck header, commander picker, bracket switch */
.cmdrs{display:flex;gap:var(--sp-2);overflow-x:auto;padding:2px 2px var(--sp-2);scroll-snap-type:x proximity}
.cmdr{width:112px;flex:none;text-align:center;font:500 var(--fs-xs)/1.25 var(--body);scroll-snap-align:start;padding:var(--sp-1);border:2px solid transparent}
.cmdr[aria-pressed="true"]{border-color:var(--accent)}
.deckhead{display:grid;gap:var(--sp-3);min-width:0}
.deckhead>*{min-width:0}
.deckhead h2{font-size:clamp(28px,3vw + 16px,42px);margin:0}
.deckhead .row{flex-wrap:nowrap;align-items:stretch}
.seg{display:flex;gap:var(--sp-1);overflow-x:auto;min-width:0;flex:1 1 auto;scrollbar-width:none}
.seg .btn{display:grid;align-content:center;text-align:left;min-width:0;flex:1 1 0;padding:var(--sp-1) var(--sp-3);line-height:1.2}
.seg .btn b{font:400 18px var(--display);letter-spacing:.5px}.seg .btn small{color:var(--muted);font-size:var(--fs-xs);white-space:nowrap}
.seg .btn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.deckhead .copy{flex:none;white-space:nowrap}
@media (max-width:420px){.deckhead .row{flex-wrap:wrap}.deckhead .copy{flex:1 1 100%}}
@media (min-width:821px){.deckhead{grid-template-columns:minmax(0,1fr) auto;align-items:end}.seg{flex:none}.seg .btn{flex:none;min-width:112px}}

/* overview */
.overview{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-4);align-items:start}
@media (min-width:1025px){.overview{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:var(--sp-5)}}
.ovgrid{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:var(--sp-4);align-items:start}
@media (min-width:641px){.ovgrid{grid-template-columns:minmax(0,1fr) 168px;gap:var(--sp-5)}}
.hero{width:100%;cursor:zoom-in;box-shadow:var(--shadow-card);grid-row:1;grid-column:2}
.ovgrid>div:first-child{grid-row:1;grid-column:1;min-width:0}
.pitch{font-size:var(--fs-lg);font-weight:500;line-height:1.45;margin:0 0 var(--sp-3);max-width:62ch}
.sumgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-4) var(--sp-5);margin:var(--sp-1) 0 var(--sp-3)}
@media (min-width:641px){.sumgrid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
@media (min-width:901px){.sumgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sumgrid ul{margin:0;padding-left:18px;display:grid;gap:var(--sp-1);font-size:var(--fs-sm);line-height:1.45}
.sumgrid p{margin:0;font-size:var(--fs-sm);line-height:1.5}
.keys,.sumgrid ul.keys{display:flex;flex-wrap:wrap;gap:var(--sp-2);padding:0;list-style:none}
.keys button{cursor:zoom-in;font:500 var(--fs-sm) var(--body);color:var(--text);background:var(--surface-2);border:1px solid transparent;border-radius:var(--r-pill);padding:0 var(--sp-3);min-height:32px}
.keys button:hover{border-color:var(--s1)}
@media (pointer:coarse){.keys button{min-height:40px}}

/* ---------- images from atlas ---------- */

 const a=ATL&&ATL.cards[key];if(!a)return "";const[i,x,y]=a,[w,h]=ATL.cell,c=ATL.cols,r=ATL.rows;
