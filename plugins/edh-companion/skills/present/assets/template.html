 --ctl:40px;--gutter:clamp(16px,3vw,32px);--maxw:1200px;--maxw-hero:1320px;--nav-h:48px;--sec-gap:var(--sp-7);--prose:68ch;
 --bg:var(--l-bg,#f5f6f8);--surface:var(--l-surface,#ffffff);--surface-2:var(--l-surface2,#eaecf0);--ctl-border:var(--l-border,#7d838e);--border:color-mix(in srgb,var(--ctl-border) 40%,var(--bg));

@media (pointer:coarse){:root{--ctl:44px}}

/* base */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(var(--nav-h) + var(--sp-4));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 var(--fs-base)/1.5 var(--body);overflow-wrap:break-word}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:var(--sp-3);top:-80px;z-index:60;background:var(--surface);color:var(--text);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-tile);box-shadow:var(--shadow-2);font-weight:500}
.skip:focus{top:var(--sp-3)}
.num{font-variant-numeric:tabular-nums}
code,.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}.note{font-size:var(--fs-sm);color:var(--muted);line-height:1.5}
h1,h2,h3,h4{text-wrap:balance}
h2{font:400 var(--fs-xl)/1.2 var(--display);margin:0}
h3{font:600 var(--fs-md)/1.3 var(--body);margin:var(--sp-6) 0 var(--sp-3)}
h4{font:600 var(--fs-base)/1.4 var(--body);margin:0}
.lbl{font-weight:500;color:var(--muted)}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:max(var(--gutter),env(safe-area-inset-left,0px)) max(var(--gutter),env(safe-area-inset-right,0px))}
.row{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-4)}
@media (min-width:960px){.two{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* sections: flat on the page, rhythm from spacing; the same box for deck sections and other tabs */
main{padding-bottom:var(--sp-9);min-height:50vh}
.sec,.panel{max-width:var(--maxw);margin-inline:auto;padding:var(--sec-gap) var(--gutter) 0;min-width:0}
.panel{padding-top:var(--sp-6)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--sp-2) var(--sp-4);margin-bottom:var(--sp-5)}
.sec-head .lede{grid-column:1/-1;margin:0;color:var(--muted);max-width:var(--prose)}
.panel>h2{margin-bottom:var(--sp-3)}.panel>p{max-width:var(--prose)}
.sec>h3:first-child,.panel>h3:first-child{margin-top:0}

/* masthead: page title on multi-part pages; hidden when the hero carries the title */
header.mast{position:relative;isolation:isolate;overflow:hidden;background:var(--art-wash);border-bottom:1px solid var(--border)}
header.mast::before,.hero::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1}
header.mast .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-4);align-items:center;padding-block:var(--sp-6)}
header.mast h1{margin:0;font:400 var(--fs-2xl)/1.1 var(--display);padding-right:56px}
body.mode-showcase header.mast h1{font-size:var(--fs-hero)}
header.mast .sub{margin:var(--sp-2) 0 0;color:var(--muted);max-width:var(--prose)}
body.herotitle header.mast{display:none}
.fanbox{display:none}
#mastfx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.fan{display:flex;align-items:flex-end;justify-content:center;height:180px}
.fan .art{width:96px;margin-left:-34px;transform:rotate(var(--r)) translateY(var(--y));box-shadow:var(--shadow-2)}
.fan .art:first-child{margin-left:0}
.fanbox.on3d .fan{display:none}
@media (min-width:960px){header.mast .wrap{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}header.mast h1{padding-right:0}
 .fanbox{display:flex;height:220px;position:relative;align-items:center;justify-content:center}}
.themebtn{font:500 16px/1 var(--body);background:var(--surface);color:var(--text);border:1px solid var(--ctl-border);border-radius:var(--r-pill);width:var(--ctl);height:var(--ctl);cursor:pointer;flex:none}
header.mast>.themebtn{position:absolute;top:var(--sp-4);right:max(var(--gutter),env(safe-area-inset-right,0px));z-index:2}
/* saved-theme textures: decorative, faint, drawn from the accent so they follow any palette */
body[data-look="comic"] :is(header.mast,.hero)::before{background:radial-gradient(color-mix(in srgb,var(--accent) 16%,transparent) 1.3px,transparent 1.8px) 0 0/9px 9px;
 -webkit-mask-image:linear-gradient(90deg,transparent 35%,#000);mask-image:linear-gradient(90deg,transparent 35%,#000)}
body[data-look="gothic"] :is(header.mast,.hero)::before{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 8%,transparent),color-mix(in srgb,var(--accent-2) 4%,transparent)),
 repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent) 4%,transparent) 0 2px,transparent 2px 24px)}
body[data-look="flames"] :is(header.mast,.hero)::before{background:linear-gradient(0deg,color-mix(in srgb,var(--accent) 12%,transparent),color-mix(in srgb,var(--accent-2) 5%,transparent) 40%,transparent 70%)}

/* page tabs (only when the report has several pages) and the sticky section nav */
nav.tabs{background:var(--bg);border-bottom:1px solid var(--border)}
body:not(.has-secnav) nav.tabs{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px)}
nav.tabs ul,.secnav ul{display:flex;gap:var(--sp-1);overflow-x:auto;scrollbar-width:none;list-style:none;margin:0;padding:0;flex:1;min-width:0}
nav.tabs .in,.secnav .in{max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter);display:flex;align-items:center;gap:var(--sp-2);min-height:var(--nav-h)}
nav.tabs button,.secnav a{display:flex;align-items:center;min-height:var(--nav-h);padding:0 var(--sp-3);font:500 var(--fs-sm)/1 var(--body);color:var(--muted);text-decoration:none;white-space:nowrap;
 background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;flex:none}
nav.tabs button:hover,.secnav a:hover{color:var(--text)}
nav.tabs button[aria-current="page"],.secnav a[aria-current]{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,.secnav a:focus-visible{outline-offset:-3px}
.secnav{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}

/* hero: the commander on a colour field taken from its art; text never sits on raw art */
.hero{position:relative;isolation:isolate;overflow:hidden;background:var(--art-wash)}
header.mast,.hero-in{--muted:var(--hero-muted)}
.hero-bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center 25%;opacity:.42;filter:saturate(1.1) blur(1px);
 -webkit-mask-image:linear-gradient(180deg,#000 0,rgb(0 0 0/.5) 200px,transparent 400px);mask-image:linear-gradient(180deg,#000 0,rgb(0 0 0/.5) 200px,transparent 400px)}
.hero-in{max-width:var(--maxw);margin:0 auto;padding:var(--sp-6) var(--gutter);display:grid;gap:var(--sp-4) var(--sp-5);grid-template-columns:minmax(0,1fr);grid-template-areas:"art" "head" "body"}
.hero-in.noart{grid-template-areas:"head" "body"}
.hero-art{grid-area:art;justify-self:center;width:min(100%,260px);min-width:0}
.hero-head{grid-area:head;min-width:0}.hero-body{grid-area:body;min-width:0}
/* below 960px the art sits behind the text: a near-opaque wash keeps text contrast whatever the artwork (art adds ≤5%) */
@media (max-width:959.98px){.hero-head,.hero-body{background:color-mix(in srgb,var(--art-wash) 90%,transparent);border-radius:var(--r-tile);padding:var(--sp-2) var(--sp-3)}}
body.mode-showcase .hero-in{max-width:var(--maxw-hero);padding-block:var(--sp-7)}
body.mode-interactive .hero-in{grid-template-columns:88px minmax(0,1fr);grid-template-areas:"art head" "body body";align-items:center}
body.mode-interactive .hero-in.noart{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "body"}
body.mode-interactive .hero-art{width:88px}
@media (min-width:600px){body.mode-interactive .hero-in{grid-template-columns:132px minmax(0,1fr)}body.mode-interactive .hero-art{width:132px}}
@media (min-width:960px){
 .hero-in{grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-areas:"art head" "art body";column-gap:var(--sp-8);row-gap:var(--sp-4)}
 .hero-art{width:min(100%,380px);justify-self:end;align-self:center}
 .hero-head{align-self:end}.hero-body{align-self:start}
 .hero-bg{-webkit-mask-image:linear-gradient(90deg,#000 0,rgb(0 0 0/.55) 26%,transparent 42%);mask-image:linear-gradient(90deg,#000 0,rgb(0 0 0/.55) 26%,transparent 42%)}
 body.mode-interactive .hero-in{grid-template-columns:184px minmax(0,1fr);grid-template-areas:"art head" "art body";column-gap:var(--sp-6)}
 body.mode-interactive .hero-art{width:184px;align-self:start}
 .hero-in.noart,body.mode-interactive .hero-in.noart{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "body"}}
.hero-card{all:unset;display:block;width:100%;cursor:zoom-in;border-radius:var(--card-r)}
.hero-card:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.hero-art .art{box-shadow:var(--shadow-2)}
.hname{font:400 var(--fs-2xl)/1.08 var(--display);margin:0}
body.mode-showcase .hname{font-size:var(--fs-hero)}
@media (max-width:599px){body.mode-interactive .hname{font-size:var(--fs-xl)}}
.meta{list-style:none;margin:var(--sp-2) 0 0;padding:0;display:flex;flex-wrap:wrap;gap:var(--sp-1) 0;color:var(--muted);font-size:var(--fs-sm)}
.meta li:not(:last-child)::after{content:",";margin-right:.35em}
.hsub{margin:var(--sp-2) 0 0;font-size:var(--fs-md);color:var(--muted)}
.verdict{font-size:var(--fs-md);line-height:1.45;max-width:var(--prose);margin:0}
body.mode-interactive .verdict{font-size:var(--fs-base)}
.hstatus{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-3);align-items:center;margin-top:var(--sp-3);font-size:var(--fs-sm)}
.hstatus a{color:var(--text)}
.hactions{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:stretch;margin-top:var(--sp-5)}
.rule0{margin-top:var(--sp-4);font-size:var(--fs-sm);max-width:var(--prose)}
.rule0 .lbl{font:600 var(--fs-sm)/1.4 var(--body);color:var(--muted);margin:0 0 var(--sp-2)}
.rule0 dl{display:grid;grid-template-columns:max-content 1fr;gap:var(--sp-1) var(--sp-4);margin:0}
.rule0 dt{color:var(--muted);font-weight:500}.rule0 dd{margin:0}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2);margin:var(--sp-5) 0 0;padding:0}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tiles.three{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{background:var(--surface);border-radius:var(--r-tile);padding:var(--sp-3) var(--sp-4);display:flex;flex-direction:column;gap:2px;min-width:0;margin:0}
.sec .stat,.panel .stat{border:1px solid var(--border)}
.stat dt,.stat .k{font-size:var(--fs-sm);color:var(--muted);font-weight:500}
.stat dd{margin:0}.stat .v{font:600 var(--fs-lg)/1.15 var(--body);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .ctx{font-size:var(--fs-xs);color:var(--muted);line-height:1.35}
a.stat{text-decoration:none;color:inherit}a.stat:hover{border-color:var(--accent)}

/* status tags: icon shape + text, never colour alone, never interactive */
.tag{display:inline-flex;align-items:center;gap:6px;font:500 var(--fs-xs)/1.2 var(--body);padding:4px 8px 4px 6px;border-radius:var(--r-tag);background:var(--unv-bg);color:var(--text);white-space:nowrap;vertical-align:middle}
.ic{--c:var(--unv);display:inline-grid;place-items:center;width:15px;height:15px;flex:none;font:700 10px/1 var(--body);color:var(--bg);background:var(--c);border-radius:50%}
.st-pass{--c:var(--ok)}.st-warning{--c:var(--warn)}.st-fail{--c:var(--fail)}.st-info{--c:var(--info)}.st-unverified{--c:var(--unv)}
.tag.st-pass{background:var(--ok-bg)}.tag.st-warning{background:var(--warn-bg)}.tag.st-fail{background:var(--fail-bg)}.tag.st-info{background:var(--info-bg)}
.ic.st-warning{border-radius:2px;clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:4px;width:17px;height:15px}
.ic.st-fail{border-radius:3px}
.ic.st-unverified{background:transparent;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.ctag{display:inline-flex;font:500 var(--fs-xs)/1.2 var(--body);padding:4px 8px;border-radius:var(--r-tag);background:var(--surface-2);color:var(--text)}
.conf{font-size:var(--fs-xs);color:var(--muted)}

/* buttons and inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);font:500 var(--fs-sm)/1.2 var(--body);cursor:pointer;background:var(--surface);color:var(--text);border:1px solid var(--ctl-border);border-radius:var(--r-tile);padding:0 var(--sp-4);min-height:var(--ctl);text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary,.copy{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover,.copy:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
select,input[type=search]{font:400 var(--fs-sm) var(--body);color:var(--text);background:var(--surface);border:1px solid var(--ctl-border);border-radius:var(--r-tile);padding:0 var(--sp-3);min-height:var(--ctl);min-width:0;width:100%}
@media (min-width:600px){select{width:auto}}
.seg{display:flex;gap:var(--sp-1);flex-wrap:wrap}
.seg .btn{display:grid;align-content:center;text-align:left;padding:var(--sp-1) var(--sp-3);line-height:1.25;min-width:96px}
.seg .btn b{font-weight:600}.seg .btn small{color:var(--muted);font-size:var(--fs-xs);white-space:nowrap}
.seg .btn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.viewtog{display:inline-flex;border:1px solid var(--ctl-border);border-radius:var(--r-tile);overflow:hidden;background:var(--surface);flex:none}
.viewtog button{flex:1;font:500 var(--fs-sm) var(--body);border:0;background:none;color:var(--muted);min-height:calc(var(--ctl) - 2px);padding:0 var(--sp-3);cursor:pointer}
.viewtog button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2);margin:0 0 var(--sp-3)}
.ctrl input[type=search],.ctrl .count{grid-column:1/-1}
.ctrl .count{margin:0;align-self:center;font-size:var(--fs-sm);color:var(--muted)}
@media (min-width:600px){.ctrl{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-3);align-items:center}.ctrl input[type=search]{flex:1 1 220px;max-width:320px}.ctrl .count{margin-left:auto}}

/* pills, tags, marks */

.pip{display:inline-block;min-width:15px;height:15px;padding:0 2px;border-radius:8px;font:700 10px/15px var(--body);text-align:center;margin-left:1px;color:#111;background:#cbc2bf;vertical-align:-2px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}

.pips{white-space:nowrap}



.legend{display:flex;gap:var(--sp-2) var(--sp-4);flex-wrap:wrap;align-items:center;font-size:var(--fs-xs);color:var(--muted);margin:var(--sp-4) 0 0}

/* card image: one component everywhere; fixed 488/680 box so nothing shifts while the atlas loads */
.art{aspect-ratio:488/680;border-radius:var(--card-r);background-color:var(--surface-2);background-repeat:no-repeat;display:block;width:100%;position:relative;overflow:hidden}

.cardgrid{--cols:3;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--sp-2);align-items:start}

@media (min-width:600px){.cardgrid{--cols:6}.cardgrid.comfy{--cols:4;gap:var(--sp-4)}}
@media (min-width:960px){.cardgrid{--cols:7}.cardgrid.comfy{--cols:5}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr));gap:var(--sp-3);align-items:start}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--sp-4)}}
.tile{all:unset;box-sizing:border-box;cursor:zoom-in;display:grid;gap:var(--sp-1);align-content:start;min-width:0;position:relative;border-radius:var(--r-tile)}

.tile .qty,.tile .rk{position:absolute;top:6px;left:6px;font:600 var(--fs-xs)/1 var(--body);background:var(--overlay);color:#fff;padding:4px 6px;border-radius:var(--r-tag);font-variant-numeric:tabular-nums}
.tile .badges{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.tile .badges>*,.tile .foot>*{font:600 10.5px/1 var(--body);padding:4px 5px;border-radius:var(--r-tag);background:var(--overlay);color:#fff;margin:0}

.tile .foot{position:absolute;left:6px;right:6px;bottom:7%;display:flex;flex-wrap:wrap;gap:3px}
.why{font-size:var(--fs-xs);color:var(--muted);line-height:1.4}
@media (hover:hover) and (prefers-reduced-motion:no-preference){body.mode-showcase .tile .art{transition:transform var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease)}
 body.mode-showcase button.tile:hover .art{transform:translateY(-2px);box-shadow:var(--shadow-2)}}

/* rankings: tier rows */
.tier{display:grid;grid-template-columns:40px minmax(0,1fr);gap:var(--sp-3);padding:var(--sp-4) 0;border-top:1px solid var(--border);content-visibility:auto;contain-intrinsic-size:auto 320px}

/* empty / missing states: what, why, what to do */

/* disclosures */
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:var(--sp-2);min-height:40px;font-weight:500;width:fit-content;max-width:100%}

.more{border-top:1px solid var(--border)}

/* deck list (list view) */
.chips{display:grid;gap:var(--sp-2);margin:0 0 var(--sp-4);padding:var(--sp-3) 0;border-block:1px solid var(--border)}
.cg{display:flex;gap:var(--sp-1);align-items:center;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px;
 -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}

.chipclr{justify-self:start;font:500 var(--fs-sm) var(--body);color:var(--accent);background:none;border:0;padding:0 var(--sp-1);min-height:32px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
@media (min-width:1280px){.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-5)}.cg{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none}.cg>:last-child{margin-right:0}.cgl{min-width:0}}

.decklist button.name{all:unset;cursor:zoom-in;min-width:0;overflow-wrap:anywhere;font-weight:500;align-self:stretch;display:flex;flex-wrap:wrap;align-items:center;gap:0 2px}

.decklist a.name{color:inherit;text-decoration:none;font-weight:500;min-width:0;overflow-wrap:anywhere}.decklist a.name:hover{color:var(--accent);text-decoration:underline}

.decklist .grp.vis{margin-bottom:var(--sp-6)}.decklist .grp.vis h3{margin-bottom:var(--sp-3)}
a.buy{color:var(--muted);text-decoration:none;align-self:stretch;display:flex;align-items:center;justify-content:flex-end}a.buy:hover{color:var(--accent);text-decoration:underline}
a.ext{color:var(--muted);text-decoration:none;font-size:var(--fs-xs);opacity:0;transition:opacity var(--dur-1);text-align:center;align-self:stretch;display:flex;align-items:center;justify-content:center}

@media (hover:none){a.ext{opacity:.8}}

.morebox{margin-top:var(--sp-5)}.keyrail>.morebox:first-child{margin-top:0}.railh{margin-bottom:var(--sp-2)!important}
.morebox .more ul{padding-left:1.25em;display:grid;gap:var(--sp-1);margin:0 0 var(--sp-4)}.morebox .more p{margin:0 0 var(--sp-4)}
@media (min-width:600px) and (max-width:959px){}
.cardchip{cursor:zoom-in;font:500 var(--fs-sm) var(--body);color:var(--text);background:var(--surface-2);border:1px solid transparent;border-radius:var(--r-pill);padding:0 var(--sp-3);min-height:32px}

/* stats and charts */

figure.chartbox{margin:0;min-width:0}
.chart{position:relative;height:220px}
.dt{margin-top:var(--sp-2);font-size:var(--fs-sm)}

.ok{color:var(--ok)}.short{color:var(--warn)}.over{color:var(--muted)}

/* changes (recommendations) */
.recs{list-style:none;margin:0;padding:0}
.rec{display:grid;grid-template-columns:56px minmax(0,1fr);gap:var(--sp-4);padding:var(--sp-4) 0;border-top:1px solid var(--border);font-size:var(--fs-sm);align-items:start;max-width:960px}

.ftoc a{display:inline-flex;align-items:center;min-height:32px;padding:0 var(--sp-3);border-radius:var(--r-pill);background:var(--surface-2);color:var(--text);text-decoration:none;font-size:var(--fs-sm)}
.ftoc a:hover{box-shadow:inset 0 0 0 1px var(--accent)}
@media (min-width:1280px){.fwrap{grid-template-columns:232px minmax(0,1fr);column-gap:var(--sp-7);align-items:start}
 .ftoc{position:sticky;top:calc(var(--nav-h) + var(--sp-5));max-height:calc(100vh - var(--nav-h) - var(--sp-7));overflow:auto}
 .ftoc ul{display:grid;gap:0}.ftoc a{display:flex;justify-content:space-between;background:none;border-radius:var(--r-tag);min-height:34px;padding:0 var(--sp-2)}.ftoc a:hover{background:var(--surface-2);box-shadow:none}}

.cite{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:var(--r-tag);background:var(--surface-2);color:var(--text);font:600 var(--fs-xs)/1 var(--body);text-decoration:none;font-variant-numeric:tabular-nums}

a.ts{font-size:var(--fs-sm);font-variant-numeric:tabular-nums}

.counts{list-style:none;padding:0;margin:var(--sp-5) 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2);max-width:880px}
