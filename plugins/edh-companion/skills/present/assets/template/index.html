<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<body>
<a class="skip" href="#main">Skip to content</a>
<header class="mast" id="mast"><div class="wrap"><div><h1 id="title"></h1><p class="sub" id="subtitle"></p></div>
<div class="fanbox" id="fanbox" aria-hidden="true"><canvas id="mastfx"></canvas><div class="fan" id="fan"></div></div></div>
<button class="btn icon themebtn" id="themeBtn" type="button" aria-label="Switch to dark theme" title="Switch theme">◐</button></header>
<nav class="tabs" aria-label="Report pages" id="tabsNav" hidden><div class="in"><ul id="tabs"></ul></div></nav>
<main id="main" tabindex="-1"></main>
<footer class="foot" id="foot"></footer>
<dialog id="viewer" aria-label="Card viewer"><div class="vw">
 <div><div class="stage" id="stage"><div class="card3d" id="card3d"><div class="face front"><div class="art" id="vFront" role="img"></div><div class="sheen"></div></div>
 <div class="face back"><div class="art" id="vBack"></div><div class="sheen"></div></div></div></div>
 <div class="vbtns"><button class="btn" id="vPrev" type="button" aria-label="Previous card">←</button><button class="btn" id="vFlip" type="button">Flip (F)</button>
 <button class="btn" id="vNext" type="button" aria-label="Next card">→</button><button class="btn" id="vClose" type="button">Close</button></div></div>
 <div class="side" id="vSide"></div></div></dialog>
