<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Design: Anton display type + IBM Plex body; masthead with a 3D card fan; panels, big-number tiles, 3-column decklist
   with official mana-color pips and rarity dots; dark blurred lightbox. Colors are tokens with a dark mode. */
:root{color-scheme:light;
 --bg:#eef1f6;--surface:#ffffff;--surface-2:#e3e8f1;--field:#f7f9fc;--line:#d5dbe6;--grid:#e6eaf1;
 --text:#131a2a;--text-2:#3f4a5e;--muted:#566074;--accent:#d42a3c;--gold:#9a6c0e;--gc:#6250d6;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
 --good:#2c7a4b;--warn:#9a6c0e;--bad:#c0392b;
 --t-S:#184f95;--t-A:#256abf;--t-B:#3987e5;--t-C:#6da7ec;--t-D:#86b6ef;
 --display:"Anton","Impact","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
 --radius:4px;--gutter:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
 --bg:#0d111a;--surface:#161c29;--surface-2:#222a3b;--field:#10151f;--line:#2a3245;--grid:#222a3a;
 --text:#e7ebf3;--text-2:#c3cad8;--muted:#9aa4b8;--accent:#ff5c6c;--gold:#e3b04b;--gc:#9085e9;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
 --good:#5fcf8c;--warn:#e3b04b;--bad:#f0605a;--t-S:#9ec5f4;--t-A:#6da7ec;--t-B:#3987e5;--t-C:#256abf;--t-D:#184f95}}
:root[data-theme="dark"]{color-scheme:dark;
 --bg:#0d111a;--surface:#161c29;--surface-2:#222a3b;--field:#10151f;--line:#2a3245;--grid:#222a3a;
 --text:#e7ebf3;--text-2:#c3cad8;--muted:#9aa4b8;--accent:#ff5c6c;--gold:#e3b04b;--gc:#9085e9;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
 --good:#5fcf8c;--warn:#e3b04b;--bad:#f0605a;--t-S:#9ec5f4;--t-A:#6da7ec;--t-B:#3987e5;--t-C:#256abf;--t-D:#184f95}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--body)}
a{color:var(--s1)}
.num,code,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(var(--gutter),env(safe-area-inset-left,0px))}
/* masthead */
header.mast{padding:26px 0 14px;border-bottom:4px solid var(--text);overflow:hidden}
header.mast .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,42%);column-gap:24px;align-items:center}
header.mast h1{grid-column:1;grid-row:1;align-self:end;position:relative;z-index:1;margin:0;font:400 clamp(32px,6vw,58px)/.95 var(--display);letter-spacing:.5px;text-transform:uppercase;text-wrap:balance}
header.mast h1 span{color:var(--accent)}
header.mast .sub{grid-column:1;grid-row:2;align-self:start;position:relative;z-index:1;margin:8px 0 0;color:var(--muted);max-width:62ch}
.fanbox{grid-column:2;grid-row:1/span 2;height:220px;position:relative;display:flex;align-items:center;justify-content:center}
#mastfx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.fan{display:flex;align-items:flex-end;justify-content:center;height:180px}
.fan .art{width:96px;margin-left:-34px;transform:rotate(var(--r)) translateY(var(--y));transition:transform .3s;box-shadow:0 8px 22px #0006}
.fan .art:first-child{margin-left:0}.fanbox:hover .fan .art{transform:rotate(calc(var(--r)*1.4)) translateY(calc(var(--y) - 8px))}
.fanbox.on3d .fan{display:none}
.themebtn{position:absolute;top:0;right:max(var(--gutter),env(safe-area-inset-right,0px));z-index:2;font:500 13px var(--body);background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;cursor:pointer}
@media (max-width:700px){header.mast .wrap{grid-template-columns:minmax(0,1fr)}.fanbox{position:absolute;inset:0;height:100%;grid-column:1;opacity:.18;z-index:0}}
/* tabs */
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .in{max-width:1180px;margin:0 auto;padding:8px var(--gutter);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{font:400 15px var(--display);letter-spacing:.8px;text-transform:uppercase;border:2px solid transparent;background:none;color:var(--muted);padding:6px 12px;border-radius:3px;cursor:pointer;white-space:nowrap;flex:none}
nav button:hover{color:var(--text)}nav button[aria-selected="true"]{color:var(--text);border-color:var(--text)}
button:focus-visible,summary:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--s1);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:22px var(--gutter) 64px;display:grid;gap:18px}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
h2{font:400 30px/1 var(--display);text-transform:uppercase;letter-spacing:.5px;margin:0 0 8px;text-wrap:balance}
h3{font:600 12.5px var(--body);text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:14px 0 8px}
.muted{color:var(--muted)}.t2{color:var(--text-2)}.note{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.three,.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.two,.three,.charts{grid-template-columns:minmax(0,1fr)}}
.ctrl{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:end;margin:0 0 12px}
select,input[type=search],input[type=number]{font:400 14px var(--body);color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-height:36px;min-width:0}
.btn{font:500 13px var(--body);cursor:pointer;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:7px 12px;min-height:36px}
.btn:hover{border-color:var(--s1)}
.btn.primary,.copy{background:var(--text);color:var(--bg);border-color:var(--text)}
.pill{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.6px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--text);white-space:nowrap;border:0}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--c)}
.pill.gc{background:var(--gc);color:#fff}
.tp{display:inline-block;font:600 9.5px/1 var(--mono);letter-spacing:.5px;text-transform:uppercase;padding:3px 5px;border-radius:3px;margin-left:5px;vertical-align:1px;white-space:nowrap;background:var(--c);color:#fff}
.tp.off{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:2px 4px}
.art{aspect-ratio:488/680;border-radius:4.75%/3.4%;background-color:var(--surface-2);background-repeat:no-repeat;display:block;width:100%}
/* tiers */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px;transition:transform .15s ease-out}
.tile:hover{transform:translateY(-2px)}
.tile .nm{font-weight:600;font-size:13px;margin-top:4px;line-height:1.25}.tile .meta{font-size:12px;color:var(--text-2)}
.tier{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 300px}
.tier .lt{border-radius:4px;display:grid;place-items:center;font:400 26px var(--display);color:#fff;height:44px}.tier .lt.dk{color:#0d1a2e}
/* deck: commander picker, bracket switch, summary, tiles */
.cmdrs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.cmdr{width:112px;flex:none;text-align:center;font:500 12.5px/1.2 var(--body)}
.cmdr[aria-pressed="true"]{border:2px solid var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg .btn{display:grid;text-align:left;min-width:112px;flex:none;padding:8px 12px}
.seg .btn b{font:400 18px var(--display);letter-spacing:.5px}.seg .btn small{color:var(--muted);font-size:11.5px}
.seg .btn[aria-pressed="true"]{border:2px solid var(--accent);padding:7px 11px}
.deckhead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.deckhead h2{font-size:clamp(26px,4vw,38px);margin:0}
.hero{float:right;width:150px;margin:0 0 8px 14px;cursor:zoom-in;box-shadow:0 10px 26px rgba(0,0,0,.25)}
@media (max-width:640px){.hero{width:104px}}
.pitch{font-size:16px;font-weight:500;line-height:1.45;margin:0 0 12px;max-width:62ch}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 22px;margin:4px 0 12px;clear:both}
.sumgrid h4{font:600 11.5px var(--body);text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);margin:0 0 5px}
.sumgrid ul{margin:0;padding-left:17px;display:grid;gap:3px;font-size:13.5px;line-height:1.4}
.sumgrid p{margin:0;font-size:13.5px;line-height:1.45}
.keys{display:flex;flex-wrap:wrap;gap:5px;padding:0!important;list-style:none}
.keys button{all:unset;cursor:zoom-in;font:500 12.5px var(--body);background:var(--surface-2);border-radius:999px;padding:3px 10px}
.keys button:hover{background:var(--line)}.keys button:focus-visible{outline:3px solid var(--s1);outline-offset:2px}
.thcount{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface-2);border-radius:3px;padding:8px 10px}
.stat b{display:block;font:400 24px var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.chart{position:relative;height:220px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
th{font:600 11px var(--body);text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:2px solid var(--line)}td.n,th.n{text-align:right}
.bullet{display:grid;grid-template-columns:84px minmax(0,1fr) 88px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.bullet .num{white-space:nowrap;text-align:right;font-size:12px}.bullet .bar{position:relative;height:14px;background:var(--grid);border-radius:0 4px 4px 0}
.bullet .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 22%,transparent)}
.bullet .val{position:absolute;top:0;bottom:0;left:0;background:var(--s1);border-radius:0 4px 4px 0;height:auto!important}
.ok{color:var(--good)}.short{color:var(--warn)}.over{color:var(--bad)}
/* decklist: 3 columns, mana pips, rarity dots */
.decklist .cols{columns:3 250px;column-gap:24px}
.decklist .grp{break-inside:avoid;margin-bottom:14px}
.decklist .grp h3{display:flex;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:4px;margin:0 0 4px}
.decklist .ln{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;font-size:13.5px;padding:3px 0;border-bottom:1px solid var(--line);align-items:baseline}
.decklist button.name{all:unset;cursor:zoom-in;min-width:0;overflow-wrap:anywhere;font-weight:500}
.decklist button.name:hover{color:var(--s1)}.decklist button.name:focus-visible{outline:3px solid var(--s1);outline-offset:1px}
.decklist .off{color:var(--gold)}
.overview{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.charts{grid-template-columns:repeat(2,minmax(0,1fr))!important}
@media (max-width:820px){.overview,.charts{grid-template-columns:minmax(0,1fr)!important}}
.decklist .ln{grid-template-columns:minmax(0,1fr) auto auto 14px!important}
.decklist a.name{color:inherit;text-decoration:none;font-weight:500;min-width:0;overflow-wrap:anywhere}.decklist a.name:hover{color:var(--s1);text-decoration:underline}
a.buy{color:var(--muted);text-decoration:none;border-radius:3px}a.buy:hover{color:var(--s1);text-decoration:underline}
a.ext{color:var(--muted);text-decoration:none;font-size:12px;opacity:0;transition:opacity .12s;text-align:center}
.ln:hover a.ext,a.ext:focus-visible{opacity:1}a.ext:hover{color:var(--s1)}
@media (hover:none){a.ext{opacity:.7}}
.links{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.links a{font:500 12px var(--body);color:#e7ebf3;text-decoration:none;border:1px solid #39425a;border-radius:999px;padding:4px 10px}
.links a:hover{background:#222a3b;border-color:#5a6680}.links a:focus-visible{outline:3px solid #3987e5;outline-offset:2px}
.stage{cursor:grab}.stage.grabbing,.stage.grabbing canvas{cursor:grabbing}
.vbtns .btn,#vFlip,.seg .btn,nav button{cursor:pointer}
.vbtns .btn:active{transform:scale(.96)}
.swlist{display:grid}.swrow{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,2fr) minmax(0,1.5fr) auto;gap:6px 16px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;align-items:baseline}
.swrow.other{opacity:.6}.swrow button.name{all:unset;cursor:zoom-in;font-weight:600}.swrow button.name:hover{color:var(--s1)}.swrow button.name:focus-visible{outline:3px solid var(--s1)}
@media (max-width:760px){.swrow{grid-template-columns:minmax(0,1fr) auto}.swrow>div{grid-column:1/-1}}
.pip{display:inline-block;width:14px;height:14px;border-radius:50%;font:600 9px/14px var(--mono);text-align:center;margin-left:1px;color:#111;background:#cbc2bf;vertical-align:1px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.pip.W{background:#f8f6d8}.pip.U{background:#c1d7e9}.pip.B{background:#bab1ab}.pip.R{background:#e49977}.pip.G{background:#a3c095}
.rar{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px;vertical-align:0;box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.5px var(--line)}
.rar.common{background:#1a1718}.rar.uncommon{background:linear-gradient(135deg,#d7dde4,#707883)}.rar.rare{background:linear-gradient(135deg,#f0d78c,#a58e4a)}
.rar.mythic{background:linear-gradient(135deg,#f6a35e,#bf4427)}.rar.special,.rar.bonus{background:linear-gradient(135deg,#b07ccc,#652978)}
details summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
.strip{overflow-x:auto}.legend{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin:10px 0 0}
.flag{font-size:12px;padding:1px 6px;border-radius:4px;background:color-mix(in srgb,var(--warn) 18%,transparent)}
/* hover preview */
.tip{position:fixed;z-index:20;pointer-events:none;width:220px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
@media (hover:none){.tip{display:none}}
/* viewer: dark blurred lightbox */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100vw;height:100dvh;color:#e7ebf3}
dialog::backdrop{background:rgba(5,8,13,.94);backdrop-filter:blur(4px)}
.vw{display:grid;grid-template-columns:minmax(0,420px) minmax(0,320px);gap:28px;align-items:center;justify-content:center;height:100%;padding:16px}
.stage{perspective:1200px;touch-action:none}
.card3d{position:relative;width:min(420px,86vw);aspect-ratio:488/680;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);margin:0 auto}
.card3d.dragging{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:4.75%/3.4%;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.face .art{width:100%;height:100%;border-radius:0}
.face.back{transform:rotateY(180deg)}
.sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.0;transition:opacity .2s;
 background:radial-gradient(circle at var(--mx,50%) var(--my,30%),#fff5 0%,#fff0 40%),linear-gradient(115deg,#0000 30%,#7af3 45%,#f7a3 55%,#0000 70%)}
.stage:hover .sheen{opacity:1}
body.noimg .decklist button.name{cursor:default}
body.noprice .pr,body.noprice .stat.price{display:none}
.stage.v3 .card3d{display:none}.stage canvas{display:block;margin:0 auto;width:min(420px,86vw);aspect-ratio:488/680;cursor:grab}
.side{font-size:14px;max-height:80vh;overflow:auto}
.side h3{font:400 26px/1.05 var(--display);text-transform:uppercase;letter-spacing:.5px;color:#e7ebf3;margin:0 0 6px}
.side table td,.side table th{color:#e7ebf3;border-color:#2a3245;font-family:var(--mono);font-size:12px}
.side .muted{color:#9aa4b8}
.side h3:not(:first-child){font:600 11.5px var(--body);letter-spacing:1.1px;color:#9aa4b8;margin:14px 0 6px}
.alt{border-top:1px solid #2a3245;margin-top:12px;padding-top:10px}.alt h4{font:600 11.5px var(--body);text-transform:uppercase;letter-spacing:1.1px;color:#9aa4b8;margin:0 0 6px}
.alt button{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;padding:8px 10px;margin:0 0 6px;border:1px solid #39425a;border-radius:6px;font-size:13px;line-height:1.35}
.alt button:hover{background:#222a3b}.alt button:focus-visible{outline:3px solid #3987e5}
.swp{display:inline-block;margin-left:5px;font:600 11px/1 var(--mono);color:var(--s1)}
.vbtns{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:16px}
.vbtns .btn{background:#161c29;color:#e7ebf3;border:1px solid #39425a;border-radius:999px;min-width:44px;height:44px}
.vbtns .btn:hover{background:#222a3b}
#vFlip{background:rgba(13,17,26,.62);backdrop-filter:blur(10px) saturate(1.4);border-color:rgba(255,255,255,.28);font-weight:600;padding:0 16px}
@media (max-width:760px){.vw{grid-template-columns:1fr;align-content:start;overflow:auto}.side{max-height:none}.bullet{grid-template-columns:74px 1fr 80px}}
@media (prefers-reduced-motion:reduce){.card3d,.fan .art,.tile{transition:none}.sheen{display:none}}
@media (prefers-reduced-motion:no-preference){main>*{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head>
<body>
<header class="mast"><div class="wrap"><h1 id="title"></h1><p class="sub" id="subtitle"></p>
<div class="fanbox" id="fanbox" aria-hidden="true"><canvas id="mastfx"></canvas><div class="fan" id="fan"></div></div>
<button class="themebtn" id="themeBtn" aria-label="Toggle light or dark">◐</button></div></header>
<nav><div class="in" role="tablist" id="tabs"></div></nav>
<main id="main"></main>
<dialog id="viewer" aria-label="Card viewer"><div class="vw">
 <div><div class="stage" id="stage"><div class="card3d" id="card3d"><div class="face front"><div class="art" id="vFront"></div><div class="sheen"></div></div>
 <div class="face back"><div class="art" id="vBack"></div><div class="sheen"></div></div></div></div>
 <div class="vbtns"><button class="btn" id="vPrev" aria-label="Previous card">←</button><button class="btn" id="vFlip">Flip (F)</button>
 <button class="btn" id="vNext" aria-label="Next card">→</button><button class="btn" id="vClose">Close</button></div></div>
 <div class="side" id="vSide"></div></div></dialog>
<script>/*__DATA__*/</script>
<script>
"use strict";

 SHOW=Object.assign({tiers:true,charts:true,swaps:true,sources:true,fan:true,prices:true,viewer:true},P.show||{});
 IMG=P.images||(ATL?"atlas":D.image_urls?"cdn":"none");
 document.body.classList.toggle("noimg",IMG==="none");document.body.classList.toggle("noprice",!SHOW.prices);
 if(SHOW.charts)await loadScript(CHART_URL).catch(()=>{});  // charts degrade to a note when offline
 document.title=D.title||document.title;mastTitle(D.title);$("#subtitle").textContent=D.subtitle||"";
 mastFan(SHOW.fan?fanKeys():[]);initTip();
 const t=store.get("theme",null);if(t)document.documentElement.dataset.theme=t;
 $("#themeBtn").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");const n=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=n;store.set("theme",n);go(store.get("tab"),false)};
 matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>go(store.get("tab"),false));
 buildTabs();initViewer();V3.init();go(location.hash.slice(1)||store.get("tab",""),true)}
// header fan: the page's fan cards; a one-deck page fills it from that deck's key cards, commander in the middle
function fanKeys(){let k=[...(D.fan||[])];const d=(D.groups||[]).flatMap(g=>g.commanders.flatMap(c=>c.decks))[0];
 if(k.length<3&&d){const names=((d.summary||{}).key_cards||[]).map(x=>String(x).split(/:| - /)[0].trim().toLowerCase());
  const rest=d.cards.filter(c=>!c.commander&&!c.land);
  k=[...new Set([...k,...rest.filter(c=>names.some(n=>c.name.toLowerCase().startsWith(n))).map(c=>c.img),...[...rest].sort((a,b)=>(b.price||0)-(a.price||0)).map(c=>c.img)])].slice(0,5);
  const c0=k.shift();k.splice(Math.floor(k.length/2),0,c0)}
 return k.filter(Boolean).slice(0,7)}
boot();
