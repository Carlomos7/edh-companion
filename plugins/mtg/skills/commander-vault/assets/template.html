 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
 --good:#3fb950;--warn:#d29922;--bad:#f0605a;--t-S:#9cc4f5;--t-A:#3987e5;--t-B:#2c6bb8;--t-C:#1f4d85;--t-D:#163659;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
.num,code,.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:16px 0 6px}
.muted{color:var(--muted)}.t2{color:var(--text-2)}

.btn[aria-pressed="true"],.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

.pill i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--c)}

.tile{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px}

.chart{position:relative;height:240px}
